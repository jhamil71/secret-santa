{% extends "base.html" %}
{% block title %}Organizer login{% endblock %}
{% block content %}
<h1>Organizer login</h1>
<form method="post" style="max-width:22rem">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="pw">Password</label>
  <input id="pw" type="password" name="password" autofocus required>
  <p style="margin-top:1rem"><button class="btn" type="submit">Log in</button></p>
</form>
{% endblock %}
