{% extends "base.html" %}
{% block title %}Organizer login{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:30px auto">
  <h1>Organizer login</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="pw">Password</label>
    <input id="pw" type="password" name="password" autofocus required>
    <p><button class="btn" type="submit">Log in</button></p>
  </form>
</div>
{% endblock %}
