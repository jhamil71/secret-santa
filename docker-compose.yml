services:
  santa:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Your organizer password comes from a file named .env next to this one (never committed):
      #   ADMIN_PASSWORD=your-own-password-at-least-8-characters
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Create a .env file containing ADMIN_PASSWORD=your-own-password}"
      # Public address people will use. Personal links are built from this.
      # BASE_URL: "https://santa.example.com"
      # Set to 1 once you serve the site over HTTPS.
      # COOKIE_SECURE: "1"
    volumes:
      - ./data:/app/data   # database lives here; back this folder up
